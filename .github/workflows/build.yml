name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-22.04, cmake-extra: "" }
          - { name: linux-arm64,   os: ubuntu-22.04, cmake-extra: "", pre: "sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu", toolchain: "-DCMAKE_TOOLCHAIN_FILE= -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_SYSTEM_NAME=Linux" }
          - { name: macos-arm64,   os: macos-14,     cmake-extra: "" }
          - { name: macos-x64,     os: macos-13,     cmake-extra: "" }
          - { name: win-x64,       os: windows-2022, cmake-extra: "-A x64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain (linux-arm64)
        if: matrix.name == 'linux-arm64'
        run: ${{ matrix.pre }}

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-extra }} ${{ matrix.toolchain }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (linux-x64 only)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get install -y nodejs npm || true
          node test/test.js || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CxHelperExt-${{ matrix.name }}
          path: build/CxHelperExt.node
